<section id="lista-corridas">
  <h2>Corridas Disponíveis</h2>

  @for (corrida of listaCorridas(); track corrida.id) {
    <div class="item-corrida">
      <p>
        {{ corrida.id }} - {{ corrida.descricao }} - {{ corrida.data }} - {{ corrida.distancia }}
        <button type="button" (click)="inscrever(corrida.id)">Inscrever-se</button>
      </p>
    </div>
  } @empty {
    <p>Nenhuma corrida disponível no momento.</p>
  }
</section>
