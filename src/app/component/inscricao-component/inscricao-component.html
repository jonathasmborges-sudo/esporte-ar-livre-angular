<section id="form">
  <h2>Inscrição na Corrida</h2>

  <form (ngSubmit)="finalizarInscricao()">
    <div>
      <label for="atleta">Atleta Cadastrado</label>
      <select name="atleta" [(ngModel)]="atletaSelecionado" class="input01">
        <option value="">Selecione o atleta (ou digite o CPF)</option>
      </select>

      <label for="cpf">Ou Buscar por CPF</label>
      <input type="text" name="cpf" [(ngModel)]="cpf" placeholder="000.000.000-00" maxlength="14" class="input01">
    </div>

    <div>
      <label for="corrida">Corrida Escolhida</label>
      <select name="corrida" [(ngModel)]="corridaSelecionada" class="input01">
        <option value="">Circuito das Estações - Etapa Verão (15/11/2026)</option>
      </select>

      <label>Distância da Prova</label>
      <br>
      <input type="radio" name="distancia" [(ngModel)]="distancia" value="5km"> 5km
      <input type="radio" name="distancia" [(ngModel)]="distancia" value="10km"> 10km
      <input type="radio" name="distancia" [(ngModel)]="distancia" value="25km"> 25km
    </div>

    <div>
      <label for="camiseta">Tamanho da Camiseta (Kit)</label>
      <select name="camiseta" [(ngModel)]="tamanhoCamiseta" class="input01">
        <option value="">Selecione</option>
        <option value="P">P</option>
        <option value="M">M</option>
        <option value="G">G</option>
        <option value="GG">GG</option>
      </select>

      <label for="categoria">Categoria / Faixa Etária</label>
      <input type="text" name="categoria" [(ngModel)]="categoria" class="input01" readonly>
    </div>

    <div>
      <p><strong>Valor da Inscrição: R$ {{ valorInscricao }}</strong></p>
    </div>

    <div>
      <input type="checkbox" name="termos" [(ngModel)]="aceitouTermos" id="chkTermos">
      <label for="chkTermos"> Li e aceito os termos do regulamento da prova e declaração de saúde.</label>
    </div>

    <div id="div-btns">
      <button type="submit" [disabled]="!aceitouTermos" id="btnAdd">Finalizar e Ir para Pagamento</button>
    </div>
  </form>
</section>
